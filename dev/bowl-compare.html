<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; padding:24px; font-family: system-ui, sans-serif; background:#f2f2f2; }
  .theme-row { display:flex; gap:24px; margin-bottom:24px; }
  .theme-box { padding:16px; border-radius:8px; }
  .light { background:#ffffff; --ink: #3A2C28; --ink-soft: #6b5d59; --floor: #e9e1d5; --floor-far:#d8cdbc; }
  .dark { background:#1c1c1c; --ink: #e7e2dc; --ink-soft: #9a9088; --floor: #35322e; --floor-far:#26241f; }
  .grid { display:grid; grid-template-columns: repeat(3, 150px); gap:14px; }
  .cell { text-align:center; }
  .cell svg { width:140px; height: auto; }
  .label { font-size:11px; color:#888; margin-top:4px; }
  h2 { font-family: system-ui; font-size:14px; margin: 4px 0 10px; color:#444; }
  .amber { fill:#F4A452; }
  .amberdark { fill:#DE8A3A; }
</style>
</head>
<body>
<h1 style="font:600 16px system-ui;">Bowl treatments — A (flat/dots), B (mound, no depth), C (mound+depth+clover, final)</h1>
<div id="root"></div>
<script>
const CX=130, RIM_CY=60, RIM_RX=116, RIM_RY=40, FOOT_CY=178, FOOT_RX=46, FOOT_RY=10;
const BODY = `M 246 60 C 246 110, 200 165, 176 178 A ${FOOT_RX} ${FOOT_RY} 0 0 1 84 178 C 60 165, 14 110, 14 60 A ${RIM_RX} ${RIM_RY} 0 0 0 246 60 Z`;

function clover(x,y,r,rot){
  const pts=[0,120,240].map(a=>{const rad=(a+rot)*Math.PI/180; return [x+Math.cos(rad)*r*0.55, y+Math.sin(rad)*r*0.55];});
  return pts.map(([cx,cy])=>`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r*0.62).toFixed(1)}"/>`).join("");
}

function bowlSvg(treatment, fill, ink, inkSoft, floor, floorFar){
  const f = fill/100;
  const floorY = 78, basinLeftX = 44, basinRightX = 216, innerRx=100, innerRy=32;
  let inner = `<ellipse cx="${CX}" cy="62" rx="${innerRx}" ry="${innerRy}" fill="${floorFar}"/>`;
  if (treatment !== 'A') {
    inner += `<ellipse cx="${CX}" cy="68" rx="${innerRx-10}" ry="${innerRy-7}" fill="${floor}"/>`;
  } else {
    inner += `<ellipse cx="${CX}" cy="65" rx="${innerRx-6}" ry="${innerRy-4}" fill="${floor}"/>`;
  }
  let food = '';
  if (f > 0.02) {
    if (treatment === 'A') {
      const scale = Math.sqrt(f);
      food = `<ellipse cx="${CX}" cy="${floorY}" rx="${78*scale}" ry="20*scale" fill="#F4A452"/><ellipse cx="${CX}" cy="${floorY}" rx="${78*scale}" ry="${20*scale}" fill="#F4A452"/>`;
      const dots=[]; for(let i=0;i<Math.round(4*f+2);i++){const t=-0.6+i*0.25; dots.push(`<circle cx="${CX+t*60*scale}" cy="${floorY-3}" r="4" fill="#DE8A3A"/>`);}
      food += dots.join("");
    } else {
      const width = (basinRightX-basinLeftX)*0.5*(0.32+0.68*Math.sqrt(f));
      const height = 46*f;
      const left = CX-width, right = CX+width;
      food = `<path d="M ${left} ${floorY} Q ${CX} ${floorY-2*height} ${right} ${floorY} Z" fill="#F4A452"/>`;
      if (treatment === 'C') {
        const n = Math.round(6+4*f);
        const pieces=[];
        for(let i=0;i<n;i++){
          const t = (i+0.5)/n;
          const x = left + (right-left)*t;
          const bez_y = (1-t)*(1-t)*floorY + 2*(1-t)*t*(floorY-2*height) + t*t*floorY;
          const jitter = (i%2===0? -3:3);
          const r = 5+ (i%3)*1.3;
          const edgeBreak = (i===0||i===n-1) ? 3: 0;
          pieces.push(clover(x+edgeBreak, bez_y+jitter-2, r, i*47));
        }
        food += `<g fill="#DE8A3A">${pieces.join("")}</g>`;
      } else {
        const n = Math.round(5+3*f);
        const dots=[];
        for(let i=0;i<n;i++){const t=(i+0.5)/n; const x=left+(right-left)*t; const bez_y=(1-t)*(1-t)*floorY + 2*(1-t)*t*(floorY-2*height) + t*t*floorY; dots.push(`<circle cx="${x}" cy="${bez_y-2}" r="5" fill="#DE8A3A"/>`);}
        food += dots.join("");
      }
    }
  }
  const strokeOuter = 2.6, strokeInner = 1.4;
  return `<svg viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="130" cy="192" rx="66" ry="9" fill="black" opacity="0.16"/>
    <path d="${BODY}" fill="${floor}" stroke="${ink}" stroke-width="${strokeOuter}" stroke-linejoin="round"/>
    ${inner}
    ${food}
    <ellipse cx="${CX}" cy="${RIM_CY}" rx="${RIM_RX}" ry="${RIM_RY}" fill="none" stroke="${ink}" stroke-width="${treatment==='A'?strokeOuter:strokeInner}" stroke-linejoin="round"/>
  </svg>`;
}

const fills=[20,64,100];
const treatments=['A','B','C'];
let html='';
for (const [themeName, ink, inkSoft, floor, floorFar] of [['light','#3A2C28','#6b5d59','#e9e1d5','#d8cdbc'], ['dark','#e7e2dc','#9a9088','#35322e','#26241f']]) {
  html += `<div class="theme-box ${themeName}"><h2>${themeName}</h2><div class="grid">`;
  for (const t of treatments) {
    for (const f of fills) {
      html += `<div class="cell">${bowlSvg(t,f,ink,inkSoft,floor,floorFar)}<div class="label" style="color:${ink}">${t} · ${f}%</div></div>`;
    }
  }
  html += `</div></div>`;
}
document.getElementById('root').innerHTML = `<div class="theme-row">${html}</div>`;
</script>
</body>
</html>
