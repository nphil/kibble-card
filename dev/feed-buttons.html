<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hold to feed: pick a style</title>
<style>
  :root {
    --bg: #121820;
    --card: #1c242e;
    --card-edge: #2a3542;
    --ink: #e8edf2;
    --muted: #8d9aa8;
    --feed: #43a96a;
    --kibble: #c98a4b;
    --kibble-dark: #8a5a2b;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  header { padding: 28px 20px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 15px; max-width: 60ch; line-height: 1.5; }
  .grid {
    display: grid; gap: 18px; padding: 20px; max-width: 1180px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .tile {
    position: relative; background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 20px; padding: 18px 18px 22px; overflow: hidden;
    display: flex; flex-direction: column; gap: 14px; min-height: 290px;
  }
  .tile h2 { margin: 0; font-size: 17px; display: flex; align-items: baseline; gap: 10px; }
  .tile h2 .num { color: var(--muted); font-size: 13px; font-weight: 600; }
  .tile .desc { margin: -8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .stage { position: relative; flex: 1; display: grid; place-items: center; min-height: 170px; }
  .fx { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); pointer-events: none; z-index: 5; }
  .tile.picked { outline: 3px solid var(--feed); outline-offset: -3px; }
  .pick { align-self: center; background: none; border: 1px solid var(--card-edge); color: var(--muted); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .tile.picked .pick { background: var(--feed); color: #07210f; border-color: var(--feed); font-weight: 700; }
  .hold { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; outline: none; }
  .hold:focus-visible { box-shadow: 0 0 0 3px #7cc4ff; }
  .count { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }

  /* 1 Wish orb */
  .orb { width: 132px; height: 132px; border-radius: 50%; position: relative; display: grid; place-items: center; transition: transform 160ms cubic-bezier(.3,1.6,.5,1); }
  .orb .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 360deg), #ffffff14 0); filter: drop-shadow(0 0 calc(6px + var(--p) * 18px) var(--c)); transition: filter 200ms; }
  .orb .core { position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #fff 0 4%, var(--c) 30%, #0b1020 78%); box-shadow: inset 0 0 30px #000a; transform: scale(calc(0.9 + var(--p) * 0.12)); }
  .orb .label { position: relative; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-shadow: 0 1px 6px #000; }
  .orb.pressed { transform: scale(.94); }
  .orb.done .core { animation: orbPop 700ms ease-out; }
  @keyframes orbPop { 0% { transform: scale(1.02); filter: brightness(3); } 100% { transform: scale(.95); filter: none; } }

  /* 2 Arcade */
  .arcade { width: 150px; height: 150px; position: relative; display: grid; place-items: center; }
  .arcade .leds { position: absolute; inset: 0; }
  .arcade .led { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: #3a1f24; box-shadow: inset 0 1px 2px #0008; transition: background 90ms, box-shadow 90ms; }
  .arcade .led.on { background: #ffd24a; box-shadow: 0 0 10px #ffc21a, 0 0 22px #ffa20088; }
  .arcade .dome { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #ff8a8a, #e3262f 45%, #8e0f17 100%); box-shadow: 0 10px 0 #5d0a10, 0 14px 18px #0009, inset 0 -6px 12px #0005; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: #fff; text-shadow: 0 1px 0 #0007; transition: transform 70ms, box-shadow 70ms; }
  .arcade.pressed .dome { transform: translateY(8px); box-shadow: 0 2px 0 #5d0a10, 0 4px 8px #0009, inset 0 -3px 8px #0005; }
  .arcade.done .led { animation: rainbow 900ms linear; }
  @keyframes rainbow { 0% { background: #ff4d4d; } 25% { background: #ffd24a; } 50% { background: #4dff88; } 75% { background: #4dc3ff; } 100% { background: #c34dff; } }

  /* 3 Power meter */
  .meter { width: 260px; display: grid; gap: 10px; justify-items: center; }
  .meter .bar { width: 100%; height: 34px; border-radius: 10px; background: #0b1016; border: 2px solid #3a4756; display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; padding: 4px; }
  .meter .cell { border-radius: 3px; background: #1a232d; transition: background 80ms, box-shadow 80ms, transform 80ms; }
  .meter .cell.on { background: var(--cc); box-shadow: 0 0 8px var(--cc); transform: scaleY(1.08); }
  .meter .btn { padding: 12px 26px; border-radius: 12px; background: linear-gradient(#3b4a5c, #232d38); border: 1px solid #52667c; font-weight: 800; letter-spacing: .06em; box-shadow: 0 5px 0 #121a22; transition: transform 70ms, box-shadow 70ms; }
  .meter.pressed .btn { transform: translateY(4px); box-shadow: 0 1px 0 #121a22; }
  .meter.tense .bar { animation: shake 90ms linear infinite; }
  .meter .perfect { position: absolute; top: 12px; font-weight: 900; font-size: 30px; letter-spacing: .04em; color: #ffe05a; text-shadow: 0 0 18px #ffb300, 0 3px 0 #b36b00; opacity: 0; transform: scale(.4); pointer-events: none; }
  .meter.done .perfect { animation: perfect 1100ms cubic-bezier(.2,1.6,.4,1); }
  @keyframes perfect { 0% { opacity: 0; transform: scale(.3) rotate(-8deg); } 25% { opacity: 1; transform: scale(1.15) rotate(3deg); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05) translateY(-10px); } }
  @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-1.5px, .5px); } 50% { transform: translate(1.5px, -.5px); } 75% { transform: translate(-1px, -.5px); } 100% { transform: translate(0, 0); } }

  /* 4 Kibble jar */
  .jar { width: 250px; height: 76px; border-radius: 38px; position: relative; overflow: hidden; background: linear-gradient(#ffffff10, #ffffff05); border: 2px solid #ffffff30; box-shadow: inset 0 2px 10px #ffffff10, 0 8px 22px #0006; transition: transform 160ms cubic-bezier(.3,1.6,.5,1); }
  .jar canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .jar .label { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 17px; text-shadow: 0 1px 6px #000c; }
  .jar .shine { position: absolute; left: 18px; right: 18px; top: 7px; height: 10px; border-radius: 10px; background: linear-gradient(#ffffff40, #ffffff00); }
  .jar.pressed { transform: scale(.96); }
  .jar.done { animation: jarBounce 600ms cubic-bezier(.2,1.8,.4,1); }
  @keyframes jarBounce { 0% { transform: scale(.94); } 40% { transform: scale(1.08, .94); } 100% { transform: scale(1); } }

  /* 5 Neon */
  .neon { width: 250px; height: 70px; position: relative; display: grid; place-items: center; }
  .neon svg { position: absolute; inset: 0; overflow: visible; }
  .neon .track { fill: #0a0f18; stroke: #1d2a3d; stroke-width: 2; }
  .neon .trace { fill: none; stroke: url(#neonGrad); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px #37f) drop-shadow(0 0 calc(4px + var(--p) * 16px) #f3c); }
  .neon .label { position: relative; font-weight: 800; letter-spacing: .18em; font-size: 15px; color: #cfe3ff; text-shadow: 0 0 calc(2px + var(--p) * 14px) #5af; }
  .neon.done .label { animation: glitch 700ms steps(2) ; }
  @keyframes glitch { 0% { transform: translate(0); text-shadow: -2px 0 #f0f, 2px 0 #0ff; } 20% { transform: translate(-3px, 1px); } 40% { transform: translate(3px, -1px); text-shadow: 3px 0 #f0f, -3px 0 #0ff; } 60% { transform: translate(-1px, 2px); } 100% { transform: translate(0); } }

  /* 6 Sigil */
  .sigil { width: 160px; height: 160px; position: relative; display: grid; place-items: center; }
  .sigil svg { position: absolute; inset: 0; overflow: visible; }
  .sigil .runes { transform-origin: 80px 80px; animation: spin 14s linear infinite; }
  .sigil .inner { transform-origin: 80px 80px; animation: spin 9s linear infinite reverse; }
  .sigil .c { fill: none; stroke: #b98cff; stroke-linecap: round; filter: drop-shadow(0 0 6px #9a5bff); }
  .sigil .label { position: relative; font-weight: 800; font-size: 13px; letter-spacing: .12em; color: #eadcff; text-shadow: 0 0 10px #9a5bff; }
  .sigil.pressed .runes { animation-duration: 2s; }
  .sigil.done { animation: flashWhite 700ms ease-out; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flashWhite { 0% { filter: brightness(3.5); } 100% { filter: none; } }

  /* 7 Slot reels */
  .slots { display: grid; gap: 12px; justify-items: center; }
  .reels { display: flex; gap: 8px; padding: 10px; border-radius: 14px; background: linear-gradient(#ffd46b, #c7881c); box-shadow: 0 6px 0 #7a4f0a, 0 10px 20px #0008; }
  .reel { width: 56px; height: 64px; border-radius: 8px; background: linear-gradient(#fff, #e8e2d6 50%, #fff); overflow: hidden; position: relative; box-shadow: inset 0 6px 8px #0003, inset 0 -6px 8px #0003; }
  .reel .strip { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; }
  .reel .sym { height: 64px; display: grid; place-items: center; font-size: 34px; }
  .reel.locked { box-shadow: inset 0 0 0 3px #43a96a, inset 0 6px 8px #0003; }
  .slots .lever { padding: 11px 28px; border-radius: 999px; background: linear-gradient(#e34a4a, #9e1c1c); font-weight: 900; letter-spacing: .06em; box-shadow: 0 5px 0 #5c0c0c; transition: transform 70ms, box-shadow 70ms; }
  .slots.pressed .lever { transform: translateY(4px); box-shadow: 0 1px 0 #5c0c0c; }
  .slots .jackpot { position: absolute; top: 0; font-weight: 900; font-size: 26px; color: #ffe05a; text-shadow: 0 0 16px #ffb300, 0 3px 0 #9a5c00; opacity: 0; }
  .slots.done .jackpot { animation: perfect 1300ms cubic-bezier(.2,1.6,.4,1); }

  /* 8 Activity ring */
  .ringbtn { width: 150px; height: 150px; position: relative; display: grid; place-items: center; transition: transform 160ms cubic-bezier(.3,1.6,.5,1); }
  .ringbtn svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
  .ringbtn .bg { fill: none; stroke: #ffffff12; stroke-width: 18; }
  .ringbtn .fg { fill: none; stroke: url(#ringGrad); stroke-width: 18; stroke-linecap: round; filter: drop-shadow(0 0 6px #43e08a88); }
  .ringbtn .label { display: grid; justify-items: center; line-height: 1.1; }
  .ringbtn .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ringbtn .small { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
  .ringbtn.pressed { transform: scale(.95); }
  .ringbtn.done { animation: ringDone 800ms cubic-bezier(.2,1.8,.4,1); }
  @keyframes ringDone { 0% { transform: scale(.9); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

  /* 9 Jelly */
  .jelly { width: 210px; height: 84px; border-radius: 42px; position: relative; overflow: hidden; background: radial-gradient(circle at 30% 25%, #ffb3d6, #ff6fb0 45%, #d93a86 100%); box-shadow: inset 0 -8px 16px #a0205f, inset 0 6px 12px #ffffff70, 0 10px 24px #ff4fa04a; transform-origin: 50% 100%; display: grid; place-items: center; }
  .jelly .label { position: relative; z-index: 2; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 #b02a6e; }
  .jelly canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .jelly.done { animation: wobble 900ms cubic-bezier(.2,.8,.3,1); }
  @keyframes wobble { 0% { transform: scale(1.25, .7); } 25% { transform: scale(.85, 1.2); } 45% { transform: scale(1.1, .92); } 65% { transform: scale(.96, 1.05); } 100% { transform: scale(1); } }

  /* 10 8-bit */
  .pixel { width: 260px; display: grid; gap: 10px; justify-items: center; font-family: "Courier New", ui-monospace, monospace; image-rendering: pixelated; }
  .pixel .frame { width: 100%; height: 54px; background: #0b0b18; border: 4px solid #fff; box-shadow: 4px 4px 0 #000, inset 0 0 0 4px #0b0b18; display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; padding: 6px; }
  .pixel .blk { background: #1c1c38; }
  .pixel .blk.on { background: var(--bc); box-shadow: inset -3px -3px 0 #0005, inset 3px 3px 0 #fff4; }
  .pixel .btn { padding: 10px 20px; background: #3b5bdb; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; font-weight: 900; font-size: 16px; letter-spacing: .08em; color: #fff; text-transform: uppercase; transition: transform 60ms, box-shadow 60ms; }
  .pixel.pressed .btn { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
  .pixel .lvl { position: absolute; top: 4px; font-weight: 900; font-size: 26px; color: #ffe94d; text-shadow: 3px 3px 0 #c2410c; opacity: 0; letter-spacing: .05em; }
  .pixel.done .lvl { animation: levelup 1300ms steps(8); }
  @keyframes levelup { 0% { opacity: 0; transform: translateY(20px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }

  /* 11 Toe beans */
  .paw { width: 150px; height: 150px; position: relative; transition: transform 160ms cubic-bezier(.3,1.6,.5,1); }
  .paw svg { width: 100%; height: 100%; overflow: visible; }
  .paw .fur { fill: #3a2f2a; }
  .paw .bean { fill: #5a3f45; transition: fill 160ms, filter 160ms; }
  .paw .bean.on { fill: #ff9ec2; filter: drop-shadow(0 0 8px #ff7fb0); }
  .paw .padfill { fill: #ff9ec2; }
  .paw.pressed { transform: scale(.93) translateY(3px); }
  .paw.done { animation: ringDone 700ms cubic-bezier(.2,1.8,.4,1); }

  /* 12 Treasure chest */
  .chest { width: 150px; height: 140px; position: relative; }
  .chest svg { width: 100%; height: 100%; overflow: visible; }
  .chest .lid { transform-origin: 75px 62px; transition: transform 500ms cubic-bezier(.2,1.6,.4,1); }
  .chest.open .lid { transform: rotate(-38deg) translate(-6px, -6px); }
  .chest .glow { opacity: var(--g); filter: blur(4px); }
  .chest .rays { opacity: 0; transform-origin: 75px 60px; }
  .chest.open .rays { animation: rays 1400ms ease-out; }
  @keyframes rays { 0% { opacity: 0; transform: scale(.3) rotate(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6) rotate(25deg); } }
  .chest.tense .body { animation: shake 70ms linear infinite; }
  .chest-label { font-weight: 800; font-size: 13px; letter-spacing: .1em; color: #ffd98a; text-align: center; }
</style>
</head>
<style>
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs a { color: var(--muted); text-decoration: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--card-edge); font-size: 14px; }
  .tabs a.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
</style>
<body>
<header>
  <nav class="tabs"><a class="on" href="feed-buttons.html">Feed buttons</a><a href="feed-layouts.html">Bowl and hopper</a></nav>
  <h1>Hold to feed: pick a style</h1>
  <p>Twelve takes on the same interaction. Press and hold any of them (mouse, finger, or focus it and hold Space). Let go early to see how it cancels. Tap "I like this one" on the ones you want, then tell me which numbers.</p>
</header>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="neonGrad" x1="0" x2="1"><stop offset="0" stop-color="#37e0ff" /><stop offset=".5" stop-color="#7a5cff" /><stop offset="1" stop-color="#ff3ccf" /></linearGradient>
    <linearGradient id="ringGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1fd17a" /><stop offset="1" stop-color="#b6ff5c" /></linearGradient>
  </defs>
</svg>
<main class="grid" id="grid"></main>

<script>
const HOLD_MS = 1400;
const TIERS = [0.33, 0.66, 0.9];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

/* ---------- particles ---------- */
class FX {
  constructor(canvas) {
    this.c = canvas; this.ctx = canvas.getContext("2d"); this.parts = []; this.running = false;
    new ResizeObserver(() => this.resize()).observe(canvas); this.resize();
  }
  resize() { const r = this.c.getBoundingClientRect(); const d = devicePixelRatio || 1; this.c.width = r.width * d; this.c.height = r.height * d; this.ctx.setTransform(d, 0, 0, d, 0, 0); this.w = r.width; this.h = r.height; }
  center() { return { x: this.w / 2, y: this.h / 2 }; }
  emit(o) {
    if (reduced) return;
    const { x, y, n = 30, colors = ["#fff"], speed = [2, 7], gravity = 0.18, life = [40, 80], size = [2, 5], shape = "circle", spread = Math.PI * 2, dir = 0, drag = 0.985, inward = false } = o;
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - 0.5) * spread; const s = speed[0] + Math.random() * (speed[1] - speed[0]);
      const L = life[0] + Math.random() * (life[1] - life[0]);
      const p = { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: gravity, life: L, max: L, r: size[0] + Math.random() * (size[1] - size[0]), col: colors[(Math.random() * colors.length) | 0], shape, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, drag };
      if (inward) { const d = 70 + Math.random() * 40; p.x = x + Math.cos(a) * d; p.y = y + Math.sin(a) * d; p.vx = -Math.cos(a) * s; p.vy = -Math.sin(a) * s; p.g = 0; }
      this.parts.push(p);
    }
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.tick()); }
  }
  draw(p) {
    const k = this.ctx; const a = Math.max(0, p.life / p.max); k.globalAlpha = a; k.fillStyle = p.col;
    k.save(); k.translate(p.x, p.y); k.rotate(p.rot);
    if (p.shape === "star") { k.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? p.r * 0.45 : p.r; const t = (i / 10) * Math.PI * 2; k.lineTo(Math.cos(t) * r, Math.sin(t) * r); } k.fill(); }
    else if (p.shape === "kibble") { for (let i = 0; i < 3; i++) { const t = (i / 3) * Math.PI * 2; k.beginPath(); k.arc(Math.cos(t) * p.r * 0.5, Math.sin(t) * p.r * 0.5, p.r * 0.62, 0, 6.28); k.fill(); } }
    else if (p.shape === "square") { k.fillRect(-p.r, -p.r, p.r * 2, p.r * 2); }
    else if (p.shape === "coin") { k.beginPath(); k.ellipse(0, 0, p.r, p.r * Math.abs(Math.cos(p.rot * 3)) + 0.5, 0, 0, 6.28); k.fill(); }
    else if (p.shape === "heart") { const r = p.r; k.beginPath(); k.moveTo(0, r * 0.9); k.bezierCurveTo(-r * 1.6, -r * 0.2, -r * 0.6, -r * 1.3, 0, -r * 0.4); k.bezierCurveTo(r * 0.6, -r * 1.3, r * 1.6, -r * 0.2, 0, r * 0.9); k.fill(); }
    else if (p.shape === "line") { k.fillRect(0, -1, p.r * 4, 2); }
    else if (p.shape === "paw") { k.beginPath(); k.ellipse(0, p.r * 0.4, p.r * 0.7, p.r * 0.55, 0, 0, 6.28); k.fill(); for (const [dx, dy] of [[-0.75, -0.35], [-0.28, -0.8], [0.28, -0.8], [0.75, -0.35]]) { k.beginPath(); k.arc(dx * p.r, dy * p.r, p.r * 0.26, 0, 6.28); k.fill(); } }
    else { k.beginPath(); k.arc(0, 0, p.r, 0, 6.28); k.fill(); }
    k.restore(); k.globalAlpha = 1;
  }
  tick() {
    this.ctx.clearRect(0, 0, this.w, this.h);
    this.parts = this.parts.filter((p) => { p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--; this.draw(p); return p.life > 0; });
    if (this.parts.length) requestAnimationFrame(() => this.tick()); else { this.running = false; this.ctx.clearRect(0, 0, this.w, this.h); }
  }
}

/* ---------- hold engine ---------- */
function holdable(el, h) {
  let p = 0, start = 0, raf = 0, holding = false, locked = false, tier = 0, drainFrom = 0, drainStart = 0;
  const set = (v, draining) => { p = v; h.progress(v, { draining }); };
  const frame = (now) => {
    if (holding) {
      const v = Math.min(1, (now - start) / HOLD_MS);
      while (tier < TIERS.length && v >= TIERS[tier]) { h.tier && h.tier(tier, v); buzz(12); tier++; }
      set(v, false);
      if (v >= 1) { holding = false; locked = true; buzz([30, 40, 60]); h.complete(); el.classList.remove("pressed"); setTimeout(() => { locked = false; tier = 0; set(0, false); h.reset && h.reset(); }, 1900); return; }
      raf = requestAnimationFrame(frame);
    } else if (drainStart) {
      const t = Math.min(1, (now - drainStart) / 320); const v = drainFrom * (1 - (1 - Math.pow(1 - t, 3)));
      set(v, true);
      if (t < 1) raf = requestAnimationFrame(frame); else { drainStart = 0; tier = 0; set(0, false); h.reset && h.reset(); }
    }
  };
  const down = (e) => {
    if (locked || holding) return; if (e && e.pointerId != null) el.setPointerCapture(e.pointerId);
    holding = true; drainStart = 0; tier = 0; start = performance.now() - p * HOLD_MS; el.classList.add("pressed"); buzz(8); h.start && h.start();

      progress(p) { ch.style.setProperty("--g", p * p); ch.classList.toggle("tense", p > 0.55 && p < 1); },
      tier() { const r = ch.getBoundingClientRect(), f = fx.c.getBoundingClientRect(); fx.emit({ x: r.left - f.left + r.width / 2, y: r.top - f.top + r.height * 0.44, n: 8, dir: -Math.PI / 2, spread: 2, speed: [1, 3], gravity: -0.02, life: [20, 35], size: [1.5, 3], colors: ["#ffe99a", "#fff"] }); },
      complete() { ch.classList.remove("tense"); ch.classList.add("open"); const r = ch.getBoundingClientRect(), f = fx.c.getBoundingClientRect(); const x = r.left - f.left + r.width / 2, y = r.top - f.top + r.height * 0.42; fx.emit({ x, y, n: 36, dir: -Math.PI / 2, spread: 1.4, speed: [5, 11], gravity: 0.32, life: [60, 100], size: [4, 7], shape: "kibble", colors: kibbleCols }); fx.emit({ x, y, n: 30, dir: -Math.PI / 2, spread: 2, speed: [2, 7], gravity: 0.05, life: [30, 60], size: [2, 4], shape: "star", colors: ["#ffe99a", "#fff", "#ffc43d"] }); setTimeout(() => ch.classList.remove("open"), 1600); },
    });
  } });

/* ---------- mount ---------- */
const grid = document.getElementById("grid");
const picks = new Set(JSON.parse(localStorage.getItem("feed-style-picks") || "[]"));
V.forEach((v, i) => {
  const t = document.createElement("section"); t.className = "tile" + (picks.has(i + 1) ? " picked" : "");
  t.innerHTML = `<h2><span class="num">${i + 1}</span>${v.name}</h2><p class="desc">${v.from}</p><div class="stage">${v.html}<canvas class="fx"></canvas></div><button class="pick" type="button">${picks.has(i + 1) ? "Picked" : "I like this one"}</button>`;
  grid.append(t);
  const fx = new FX(t.querySelector(".fx"));
  v.init(t.querySelector(".stage"), fx);
  t.querySelector(".pick").addEventListener("click", (e) => { const k = i + 1; picks.has(k) ? picks.delete(k) : picks.add(k); localStorage.setItem("feed-style-picks", JSON.stringify([...picks])); t.classList.toggle("picked", picks.has(k)); e.target.textContent = picks.has(k) ? "Picked" : "I like this one"; });
});
</script>
</body>
</html>
